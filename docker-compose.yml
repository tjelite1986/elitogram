services:
  egram:
    build: .
    image: elitogram-cp2:latest
    container_name: egram
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Stockholm
      # Grabbit 3.0.4: the key Grabbit's Duplicate Manager sends to /api/dedupe.
      GRABBIT_DEDUPE_TOKEN_FILE: /run/secrets/grabbit_dedupe_token
    secrets:
      - grabbit_dedupe_token
    volumes:
      - egram_data:/data
      - ${MEDIA_HOST_DIR:?set MEDIA_HOST_DIR in .env}:/media
      - ${IMPORT_HOST_DIR:?set IMPORT_HOST_DIR in .env}:/import
      - ${BACKUP_HOST_DIR:?set BACKUP_HOST_DIR in .env}:/backups
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.egram-secure.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)"
      - "traefik.http.routers.egram-secure.entrypoints=https"
      - "traefik.http.routers.egram-secure.tls=true"
      - "traefik.http.routers.egram-secure.tls.certresolver=cloudflare"
      - "traefik.http.services.egram-service.loadbalancer.server.port=3000"

secrets:
  grabbit_dedupe_token:
    # The same file Grabbit mounts (outside every repo).
    file: /home/thomas/dockdata2/grabbit-secrets/dedupe-token

volumes:
  egram_data:

networks:
  traefik:
    external: true
